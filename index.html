<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Estoque de Casa</title>
  <link rel="stylesheet" href="style.css?v=13" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div>
        <h1>Estoque de Casa</h1>
        <div class="status-linha">
          <span id="statusDot" class="status-dot online"></span>
          <span id="statusSync">Online • Sincronizado</span>
        </div>
      </div>
      <div class="header-acoes">
        <select id="selectUsuario" aria-label="Usuário">
          <option value="Thiago">Thiago</option>
          <option value="Bárbara">Bárbara</option>
          <option value="Casa">Casa</option>
        </select>
        <button id="btnSync" class="btn-icon" title="Sincronizar agora">↻</button>
      </div>
    </div>

    <div class="fin-strip" id="finStrip">
      <div class="fin-pill"><span>Mês (Est.)</span><strong id="finEstimado">R$ 0,00</strong></div>
      <div class="fin-pill"><span>Realizado</span><strong id="finRealizado">R$ 0,00</strong></div>
      <div class="fin-pill"><span>Previsto</span><strong id="finPrevisto">R$ 0,00</strong></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="tab-despensa">📦 Despensa</button>
    <button class="tab" data-tab="tab-lista">📝 Lista</button>
    <button class="tab" data-tab="tab-mercado">🛒 Mercado</button>
  </nav>

  <main class="container">
    <!-- ABA DESPENSA -->
    <section id="tab-despensa" class="tab-panel active">
      <div class="toolbar">
        <input type="search" id="buscaItem" placeholder="Buscar produto..." />
        <button id="btnFiltroVencendo" class="btn-chip" title="Vencendo em até 7 dias">⏰ 7d</button>
        <button id="btnFiltroPausados" class="btn-chip" title="Mostrar itens pausados/inativos">⏸️ Pausados</button>
        <button id="btnNovoItem" class="btn-primary">+ Item</button>
      </div>
      <div id="filtroCategorias" class="cat-bar"></div>
      <div id="gridDespensa" class="grid-cards"></div>
    </section>

    <!-- ABA LISTA -->
    <section id="tab-lista" class="tab-panel">
      <div class="card lista-controles">
        <div class="lista-topo">
          <div>
            <label for="dataLista" class="lbl-mini">Data prevista</label>
            <input type="date" id="dataLista" />
          </div>
          <div class="lista-auto-btns">
            <button id="btnGerarRecompletar" class="btn-secondary">⚡ Recompletar</button>
            <button id="btnGerarSemana" class="btn-secondary">📅 Semana</button>
          </div>
        </div>
        <div class="add-avulso-row">
          <input type="text" id="inputAvulso" placeholder="Adicionar item avulso ou da despensa..." />
          <input type="number" id="qtdAvulso" min="1" value="1" class="input-qtd-mini" />
          <button id="btnAddAvulso" class="btn-primary">Adicionar</button>
        </div>
        <div class="lista-acoes-rodape">
          <button id="btnSalvarLista" class="btn-secondary">💾 Salvar lista</button>
          <button id="btnIrMercado" class="btn-primary">Ir para Mercado →</button>
        </div>
      </div>
      <div id="listaContainer" class="stack-cards"></div>
    </section>

    <!-- ABA MODO MERCADO -->
    <section id="tab-mercado" class="tab-panel">
      <div class="card mercado-topo">
        <div class="mercado-selects">
          <select id="selectLocalMercado">
            <option value="">Mercado / Local...</option>
          </select>
          <button id="btnNovoMercado" class="btn-secondary">+ Local</button>
          <button id="btnAbrirIA" class="btn-secondary">✨ Encarte/Cupom</button>
        </div>
      </div>

      <div id="mercadoContainer" class="stack-cards mercado-lista-pad"></div>

      <div class="mercado-barra-fixa">
        <div class="totais-mercado">
          <div>
            <small>No carrinho</small>
            <strong id="totalCarrinho">R$ 0,00</strong>
          </div>
          <div class="text-right">
            <small>Estimado lista</small>
            <strong id="totalEstimadoMercado">R$ 0,00</strong>
          </div>
        </div>
        <button id="btnFinalizarCompra" class="btn-success">✓ Finalizar Compra</button>
      </div>
    </section>
  </main>

  <!-- MODAL CADASTRO / EDIÇÃO DE ITEM -->
  <div id="modalItem" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalItemTitulo">Novo item</h2>
        <button type="button" class="btn-fechar" data-fechar="modalItem">✕</button>
      </div>
      <form id="formItem" class="form-grid">
        <input type="hidden" id="itemId" />
        <label>Nome do produto*
          <input type="text" id="itemNome" required placeholder="Ex.: Arroz 5kg" />
        </label>
        <div class="form-row-2">
          <label>Categoria
            <select id="itemCategoria"></select>
          </label>
          <label>Unidade de consumo
            <input type="text" id="itemUnidade" value="Unidade" placeholder="Ex.: Unidade, Pacote, Caixa" />
          </label>
        </div>
        <div class="form-row-3">
          <label>Estoque atual
            <input type="number" id="itemAtual" min="0" step="any" value="0" />
          </label>
          <label>Mínimo (alerta)
            <input type="number" id="itemMin" min="0" step="any" value="1" />
          </label>
          <label>Alvo / Máximo
            <input type="number" id="itemMax" min="0" step="any" value="2" />
          </label>
        </div>
        <div class="form-row-2">
          <label>Qtd por fardo/caixa
            <input type="number" id="itemFardo" min="1" step="any" value="1" />
          </label>
          <label>Último preço (R$)
            <input type="text" inputmode="numeric" id="itemPreco" value="0,00" />
          </label>
        </div>
        <div class="form-row-2">
          <label>Marca de referência
            <input type="text" id="itemMarca" placeholder="Ex.: Tio João" />
          </label>
          <label>Validade próxima
            <input type="date" id="itemValidade" />
          </label>
        </div>
        <label class="check-row">
          <input type="checkbox" id="itemAtivo" checked />
          <span>Item ativo na lista automática (desmarque para pausar / sob demanda)</span>
        </label>
        <div class="form-row-2">
          <label class="btn-secondary file-btn">
            📷 Foto do produto
            <input type="file" id="inputFotoItem" accept="image/*" capture="environment" hidden />
          </label>
          <span id="nomeFotoSelecionada" class="hint">Nenhuma foto nova</span>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" data-fechar="modalItem">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL HISTÓRICO DE PREÇOS -->
  <div id="modalHistorico" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="tituloHistorico">Histórico de preços</h2>
        <button type="button" class="btn-fechar" data-fechar="modalHistorico">✕</button>
      </div>
      <div id="conteudoHistorico"></div>
    </div>
  </div>

  <!-- MODAL LEITOR IA (ENCARTE / CUPOM) -->
  <div id="modalIA" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2>✨ Ler Encarte ou Cupom com IA</h2>
        <button type="button" class="btn-fechar" data-fechar="modalIA">✕</button>
      </div>
      <div class="form-grid">
        <div class="form-row-2">
          <button type="button" id="modoIAEncarte" class="btn-primary">🏷️ Encarte / Oferta</button>
          <button type="button" id="modoIACupom" class="btn-secondary">🧾 Cupom Fiscal</button>
        </div>
        <label>Cole o texto ou observação
          <textarea id="textoIA" rows="3" placeholder="Ex.: Arroz 5kg R$ 22,90 - Fujiyama"></textarea>
        </label>
        <label class="btn-secondary file-btn">
          📸 Selecionar / tirar foto
          <input type="file" id="fotoIA" accept="image/*" capture="environment" hidden />
        </label>
        <button type="button" id="btnAnalisarIA" class="btn-primary">Analisar agora</button>
        <div id="resultadoIA" class="stack-cards"></div>
      </div>
    </div>
  </div>

  <script src="app.js?v=13"></script>
</body>
</html>
